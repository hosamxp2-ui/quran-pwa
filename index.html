<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="sepia">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف - المصحف المدني</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4332">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="prayer-bar" class="prayer-bar">
        <span>🕌 الصلاة القادمة: <strong id="next-prayer-name">العصر</strong> (<span id="next-prayer-time">3:58 م</span>) • بقي <strong id="prayer-countdown">45 دقيقة</strong></span>
    </div>

    <header class="main-header">
        <div class="logo-area">
            <h1>📖 المصحف الشريف</h1>
        </div>
        <div class="header-actions">
            <button id="btn-open-settings" class="icon-btn">⚙️ الإعدادات</button>
        </div>
    </header>

    <section class="tracker-bar">
        <div class="navigation-tabs">
            <button id="tab-madani" class="tab-btn active">المصحف المصور</button>
            <button id="tab-surahs" class="tab-btn">السور</button>
            <button id="tab-juz" class="tab-btn">الأجزاء</button>
        </div>
    </section>

    <main class="container">
        <!-- عرض صفحات المصحف المصورة -->
        <section id="madani-page-view" class="view">
            <div class="page-controls">
                <button id="btn-prev-page" class="btn-page">← الصفحة السابقة</button>
                <span id="page-info-label">صفحة 1 من 604</span>
                <button id="btn-next-page" class="btn-page">الصفحة التالية →</button>
            </div>
            <div class="madani-frame-wrapper">
                <div id="page-header-info" class="page-header-info">سورة الفاتحة • الجزء 1</div>
                <img id="madani-page-img" src="https://www.qurancentral.com/wp-content/uploads/madani/1.png" alt="صفحة المصحف" class="madani-img" onerror="this.src='https://quran.ksu.edu.eg/png_big/1.png'">
                <div id="page-footer-info" class="page-footer-info">- 1 -</div>
            </div>
        </section>

        <!-- قائمة السور -->
        <section id="grid-view" class="view hidden">
            <input type="text" id="search-input" placeholder="ابحث عن اسم السورة..." class="search-box" oninput="filterSurahs(this.value)">
            <div id="grid-container" class="surah-grid"></div>
        </section>
    </main>

    <!-- الإعدادات -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content" style="max-height:85vh; overflow-y:auto;">
            <span class="close-modal" id="close-settings-modal">&times;</span>
            <h2>⚙️ إعدادات المصحف ومركز التحميل</h2>
            
            <div class="setting-group">
                <label>مظهر التطبيق:</label>
                <select id="theme-select" class="select-box-styled" style="width:100%;">
                    <option value="sepia">📜 ورق غزال (كلاسيكي)</option>
                    <option value="light">☀️ فاتح</option>
                    <option value="dark">🌙 ليلي</option>
                </select>
            </div>

            <div class="setting-group">
                <h3>📥 مركز التحميلات المخصص</h3>
                <div id="dl-surahs-list" class="download-list"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
